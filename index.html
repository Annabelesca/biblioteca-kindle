<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi biblioteca Kindle</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>Mi biblioteca Kindle</h1>
  <p>Manga, novelas y novelas ligeras</p>
</header>

<main>
  <!-- Secciones principales -->
  <nav class="tabs" id="secciones">
    <button class="tab active" data-seccion="manga">Manga</button>
    <button class="tab" data-seccion="novela">Novelas</button>
    <button class="tab" data-seccion="novela-ligera">Novelas ligeras</button>
  </nav>

  <!-- Subsecciones de cada sección -->
  <nav class="tabs subtabs" id="vistas">
    <button class="tab active" data-vista="biblioteca">Biblioteca</button>
    <button class="tab" data-vista="colecciones">Colecciones</button>
  </nav>

  <div id="app"><div class="msg">Cargando…</div></div>
</main>

<!-- Orden de carga: primero los datos, luego las vistas y por último la aplicación -->
<script src="js/datos.js"></script>
<script src="js/libros.js"></script>
<script src="js/series.js"></script>
<script src="js/app.js"></script>
</body>
</html>
